name: Package and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semantic version format vX.Y.Z."
            exit 1
          fi

          toc_files=(
            BetterPullTen.toc
            BetterPullTen_Mainline.toc
            BetterPullTen_Vanilla.toc
            BetterPullTen_BCC.toc
            BetterPullTen_Mists.toc
          )

          for toc_file in "${toc_files[@]}"; do
            if [[ ! -f "$toc_file" ]]; then
              echo "Missing required addon file: $toc_file"
              exit 1
            fi

            toc_version="$(sed -n 's/^## Version: //p' "$toc_file")"

            if [[ "$tag_version" != "$toc_version" ]]; then
              echo "Tag v$tag_version does not match $toc_file version $toc_version."
              exit 1
            fi
          done

          for required_file in \
            BetterPullTen.lua \
            Media/Icon.png
          do
            if [[ ! -f "$required_file" ]]; then
              echo "Missing required addon file: $required_file"
              exit 1
            fi
          done

      - name: Package and publish release
        uses: BigWigsMods/packager@v2
