name: Package and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          toc_version="$(sed -n 's/^## Version: //p' BetterPullTen.toc)"

          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semantic version format vX.Y.Z."
            exit 1
          fi

          if [[ "$tag_version" != "$toc_version" ]]; then
            echo "Tag v$tag_version does not match TOC version $toc_version."
            exit 1
          fi

          for required_file in \
            BetterPullTen.lua \
            BetterPullTen.toc \
            Media/Icon.png
          do
            if [[ ! -f "$required_file" ]]; then
              echo "Missing required addon file: $required_file"
              exit 1
            fi
          done

      - name: Package and publish release
        uses: BigWigsMods/packager@v2
